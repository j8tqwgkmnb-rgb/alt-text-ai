app = "alt-text-ai-app"
primary_region = "nrt"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  NODE_ENV = "production"
  DATABASE_URL = "file:/data/prod.sqlite"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
